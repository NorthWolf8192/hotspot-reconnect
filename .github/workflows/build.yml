name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        run: .\build.ps1
      - name: Run headless core checks
        run: .\test.ps1
      - name: Package Windows application
        run: |
          Copy-Item -LiteralPath LICENSE,README.md,README.en.md -Destination dist
          Copy-Item -LiteralPath docs/USER_GUIDE.zh-CN.md -Destination dist/USER_GUIDE.zh-CN.md
          Compress-Archive -Path dist/* -DestinationPath HotspotReconnect-win.zip
      - uses: actions/upload-artifact@v7
        with:
          name: hotspot-reconnect-windows
          path: HotspotReconnect-win.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: hotspot-reconnect-windows
      - name: Attach Windows package to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" HotspotReconnect-win.zip
