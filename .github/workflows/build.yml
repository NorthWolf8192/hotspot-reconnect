name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        run: .\build.ps1
      - name: Run headless core checks
        run: .\test.ps1
      - name: Package Windows application
        run: |
          Copy-Item -LiteralPath LICENSE,README.md,README.en.md -Destination dist
          Copy-Item -LiteralPath docs/USER_GUIDE.zh-CN.md -Destination dist/USER_GUIDE.zh-CN.md
          Compress-Archive -Path dist/* -DestinationPath HotspotReconnect-win.zip
      - uses: actions/upload-artifact@v7
        with:
          name: hotspot-reconnect-windows
          path: HotspotReconnect-win.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: hotspot-reconnect-windows
      - name: Publish initial release or attach a requested release build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INITIAL_RELEASE_TAG: v1.0.0
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            gh release upload "$RELEASE_TAG" HotspotReconnect-win.zip
          elif gh release view "$INITIAL_RELEASE_TAG" >/dev/null 2>&1; then
            echo "Initial release already exists; keeping its original assets."
          else
            gh release create "$INITIAL_RELEASE_TAG" HotspotReconnect-win.zip \
              --target "$BUILD_COMMIT" \
              --title "Hotspot Reconnect v1.0.0" \
              --notes "首次公开版本。电脑唤醒后等待 5 秒，仅检查一次手机热点连接；原生 Windows 11 云母界面与托盘菜单，深浅色跟随系统。解压 HotspotReconnect-win.zip 后运行 HotspotReconnect.exe。源码和原创图标采用 MIT 许可证。"
          fi
